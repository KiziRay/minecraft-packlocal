[package]
name = "modpack-i18n-tool"
version = "0.1.6"
description = "模組包一鍵繁中翻譯"
authors = ["ZeitFrei"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "modpack_i18n_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
zhconv = { version = "0.4.1", default-features = false, features = ["mediawiki-tw", "compress"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
