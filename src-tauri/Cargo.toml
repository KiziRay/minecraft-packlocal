[package]
name = "modpack-i18n-tool"
version = "1.1.1"
description = "模組包一鍵繁中翻譯"
authors = ["ZeitFrei"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "modpack_i18n_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
zhconv = { version = "0.4.1", default-features = false, features = ["mediawiki-tw", "compress"] }
unicode-normalization = "0.1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# release manifest 的 Ed25519 信任根。兩者早已由 reqwest→rustls 帶進 Cargo.lock，
# 提升為直接依賴不引入任何新的傳遞依賴，也不增加編譯產物體積。
ring = "0.17"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
