<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模組包繁中翻譯工具</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>模組包繁中翻譯工具</h1>
        <p class="sub">
          Tauri 2 · 預設不用 AI：掃 mods 的 zh_cn／zh_tw → OpenCC 台灣用語 → 字典覆寫 → 產出資源包
        </p>
      </header>

      <section class="card">
        <label>實例路徑（Prism 實例根目錄或 minecraft 資料夾）</label>
        <div class="row">
          <input id="instance" type="text" placeholder="例如 C:\...\Craft_to_Exile_2-2.0.3" />
          <button type="button" id="pick-instance">選擇</button>
        </div>

        <label>輸出目錄</label>
        <div class="row">
          <input id="output" type="text" placeholder="輸出 resourcepacks 的上層目錄" />
          <button type="button" id="pick-output">選擇</button>
        </div>

        <label>資源包資料夾名稱</label>
        <input id="pack-name" type="text" value="模組包-繁體中文翻譯" />

        <label>資源包說明（子標題）</label>
        <input
          id="pack-desc"
          type="text"
          value="台灣用語繁體中文翻譯資源包（OpenCC／字典，非 AI）"
        />

        <div class="checks">
          <label><input type="checkbox" id="opencc" checked /> 使用 OpenCC s2twp（需本機 Python + opencc）</label>
          <label><input type="checkbox" id="strip-zhi" checked /> 去掉詞綴語尾「之」（of X 誤譯）</label>
          <label><input type="checkbox" id="fix-menu" checked /> 修正 MineMenu menu.json 為 \u 跳脫</label>
        </div>

        <div class="actions">
          <button type="button" id="scan" class="ghost">只掃描</button>
          <button type="button" id="run" class="primary">一鍵翻譯並產出資源包</button>
        </div>
      </section>

      <section class="card log-card">
        <h2>結果</h2>
        <pre id="log">就緒。選擇實例後按「一鍵翻譯」。</pre>
      </section>

      <footer>
        經驗來自 CTE2 漢化：資源包優先 · Essential／硬編碼另案 · 詳見上層
        <code>CTE2-翻譯開發統整.md</code>
      </footer>
    </main>
  </body>
</html>
